# 前端路由 + 菜单声明（控制台按此注入导航；表单骨架由 api.yaml 的 schema 生成）
plugin: dsh-plugin-panel-core
routes:
  - /panel/（独立零构建 SPA：顶栏/部门 rail/三栏/会话/任务看板/部门知识/场景图谱/制造工具箱）
menus:
-
  group: 总览
  items:
    - 部门面板（/panel/ 外链入口）
-
  group: 制造工具箱
  items:
    - 工具广场（面板内「制造」空间：13 计算内核 + 3 AI 工具）
    - 场景图谱（100 项选题来源追溯与验收标准）
    - Skill 放行台（真实评估报告审阅 → 审核人签署放行；面板配置权限）
