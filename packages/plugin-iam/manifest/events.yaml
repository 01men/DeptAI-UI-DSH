# 事件声明（发布/订阅）——跨插件联动只许通过事件或扩展点
plugin: dsh-plugin-iam
events:
  - name: iam.user.frozen
    mode: emit
    description: 账号冻结（authn 订阅吊销令牌）
  - name: iam.user.password-reset
    mode: emit
    description: 口令重置（authn 订阅吊销全部既有会话与委托，P1-08）
  - name: iam.user.activated
    mode: emit
    description: 账号恢复
  - name: iam.org.changed
    mode: emit
    description: 组织变更
  - name: iam.permission.changed
    mode: emit
    description: 权限变更（全插件缓存失效）
  - name: iam.connector.synced
    mode: emit
    description: 三方同步完成
  - name: iam.scene_policy.changed
    mode: emit
    description: 场景级授权策略变更（IAW 6-1）
