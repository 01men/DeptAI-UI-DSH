<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>元冰可 AIOS · 企业 AI 运行与治理平台</title>
  <meta name="description" content="连接目标、数字员工与企业 AI 能力，让执行有序、交付有据。支持自主部署与开放协议接入。">
  <link rel="icon" href="/ybk-mark.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/home.css">
  <link rel="stylesheet" href="/css/themes.css">
  <!-- 首屏预载（2026-10-18 · 首屏修复）：页面模块已改动态 import，落地页只可能是
       营销首页（免会话裸落地）或工作台（演示态/已登录裸落地）。这两块提前发起，
       与 app.js 并行下载，避免「外壳到了才排队取页」的二次等待。其余页面按需取。 -->
  <link rel="modulepreload" href="/js/pages/home.js">
  <link rel="modulepreload" href="/js/pages/dashboard.js">
</head>
<body>
  <div id="app">
    <!-- 加载屏：暖纸底 + 深青蓝文字（与2026-10-14 设计适配主题一致；此处尚无 CSS 变量可用，故内联色值）。
         2026-10-19 PH 首发日增强：公网经Cloudflare 隧道，首屏到内容可交互约 9s（本地 ~0.3s）。
         这段时间里访客原本只能看到一行「正在加载控制台…」，等于白等 —— 而这正是 PH 访客
         从落地页点「Open the live demo」后的必经路径，等同漏斗最后一步流失。
         改为在加载屏直接说清「正在加载什么」，把等待变成信息而不是空白。 -->
    <div style="height:100vh;display:grid;place-items:center;background:#f8f6f3">
      <div style="text-align:center;color:#0a5f87;max-width:520px;padding:0 24px">
        <img src="/ybk-mark.png" alt="元冰可" style="width:46px;height:46px;margin:0 auto 14px;border-radius:12px;display:block">
        <div style="font-size:15px;font-weight:600;letter-spacing:.02em" id="ybkBootTitle">正在加载控制台…</div>
        <div style="margin-top:10px;font-size:13px;line-height:1.7;color:#4a6572" id="ybkBootStats">正在装载 29 个插件包 · 93 个权限点 · 488 个 REST 路由 · 96 个 MCP 工具<br>
          正在连接当前配置的运行实例</div>
        <div style="margin-top:16px;height:3px;width:180px;margin-left:auto;margin-right:auto;border-radius:2px;background:#dce6ea;overflow:hidden">
          <div style="width:40%;height:100%;border-radius:2px;background:#0a5f87;animation:ybkBootSlide 1.4s ease-in-out infinite"></div>
        </div>
        <style>@keyframes ybkBootSlide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}</style>
        <noscript>
          <div style="margin-top:14px;font-size:12px;color:#7a8b94">
            控制台需要 JavaScript。若长时间无响应，请直接访问
            <a href="/launch" style="color:#0a5f87">静态介绍页</a>。
          </div>
        </noscript>
      </div>
    </div>
  </div>
  <!-- 加载屏首帧定语（2026-10-19 PH 首发日）。i18n 引擎的词典是异步 fetch，
       公网经 Cloudflare 隧道约 1 个 RTT 之后才到手；本机 0.3s 加载完反而是词典
       还没到就已被 app.js 接管。两种时序都导致「英文访客的首屏是中文」。
       PH 访客绝大多数是英文用户，首屏语言 = 对产品是否面向我的第一判断，
       所以在首个内联脚本里按 navigator.language 直接定语，零网络请求。
       与 i18n.js 的决议链同口径（localStorage rq_lang > navigator > zh-CN）。 -->
  <script>
    (function () {
      var pick = (function () { try { return localStorage.getItem('rq_lang') || '' } catch (e) { return '' } })()
      var nav = (navigator.language || 'zh-CN').toLowerCase()
      var loc = pick === 'auto' || !pick ? (nav.indexOf('zh') === 0 ? 'zh' : nav.indexOf('ja') === 0 ? 'ja' : 'en') : pick.toLowerCase()
      var T = {
        zh: ['正在加载控制台…', '正在装载 29 个插件包 · 93 个权限点 · 488 个 REST 路由 · 96 个 MCP 工具<br>正在连接当前配置的运行实例'],
        en: ['Loading console…', 'Loading 29 plugin packages · 93 permission points · 488 REST routes · 96 MCP tools<br>Connecting to your configured instance'],
        ja: ['コンソールを読み込み中…', '29 プラグイン・93 権限ポイント・488 REST ルート・96 MCP ツールを読み込み中<br>設定された実行環境に接続しています']
      }
      var t = T[loc] || T.zh
      var title = document.getElementById('ybkBootTitle')
      var stats = document.getElementById('ybkBootStats')
      if (title) title.textContent = t[0]
      if (stats) stats.innerHTML = t[1]
    })()
  </script>
  <script type="module" src="/js/i18n.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
