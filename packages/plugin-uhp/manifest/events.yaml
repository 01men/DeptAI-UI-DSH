# 事件声明（发布/订阅）——跨插件联动只许通过事件或扩展点（a2a↔uhp 只走总线铁律）
plugin: dsh-plugin-uhp
events:
  - name: a2a.task.dispatch
    mode: on
    description: 订阅：A2A 任务派发 → 启动 UHP 执行（内置 harness 单步真实模型调用）
  - name: a2a.task.cancel
    mode: on
    description: 订阅：A2A 任务取消 → UHP 取消联动（在途结果不交付）
  - name: a2a.task.progress
    mode: emit
    description: 发布：执行进度与终态（started/completed/failed/canceled）——仅「平台 A2A 派发」记录发出，驱动八态状态机；外部直调记录不发出（P0 任务劫持闸门）
  - name: uhp.response.progress
    mode: emit
    description: 发布：执行记录级进度与终态（所有来源统一发出，含外部直调/平台派发）。SSE 订阅面据此闭合 stream=true 流；不驱动任何 A2A 状态，故不扩大任务绑定闸门的攻击面（P2-03）
